name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  get_version:
    name: Get version
    runs-on: ubuntu-latest
    steps:
      - id: set_output
        run: echo ::set-output name=version::${GITHUB_REF#refs/tags/v}
    outputs:
      version: ${{ steps.set_output.outputs.version }}
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
      - run: go generate ./...
      - run: go test ./...
  build_windows:
    name: Build for Windows
    runs-on: ubuntu-latest
    needs: [get_version, test]
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
      - run: go build -ldflags="-X github.com/SoulRune/ipatool/cmd.version=$VERSION" -o ipatool-$VERSION-windows-$GOARCH.exe
        env:
          GOOS: windows
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.get_version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: ipatool-${{ needs.get_version.outputs.version }}-windows-${{ matrix.arch }}.exe
          path: ipatool-${{ needs.get_version.outputs.version }}-windows-${{ matrix.arch }}.exe
          if-no-files-found: error
  build_linux:
    name: Build for Linux
    runs-on: ${{ matrix.runner }}
    needs: [get_version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true
      - run: go build -ldflags="-X github.com/SoulRune/ipatool/cmd.version=$VERSION" -o ipatool-$VERSION-linux-$GOARCH
        env:
          GOARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.get_version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: ipatool-${{ needs.get_version.outputs.version }}-linux-${{ matrix.arch }}
          path: ipatool-${{ needs.get_version.outputs.version }}-linux-${{ matrix.arch }}
          if-no-files-found: error
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [get_version, build_windows, build_linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          tag_name: v${{ needs.get_version.outputs.version }}
